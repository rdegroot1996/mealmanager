    <style>
      :root {
        --cream: #fffaf3;
        --ink: #45352c;
        --primary: #875536;
        --line: #eee7dd;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--cream);
        color: var(--ink);
        font-family: "DM Sans", sans-serif;
      }
      main {
        width: 1280px;
        height: 640px;
        padding: 72px 80px;
        display: flex;
        flex-direction: column;
        align-items: center;
        position: relative;
      }
      main::before {
        content: "";
        position: absolute;
        inset: 24px;
        border: 2px solid var(--line);
        border-radius: 28px;
        pointer-events: none;
      }
      .brand {
        height: 120px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .brand > app-brand {
        transform: scale(2.5);
        transform-origin: center;
      }
      h1 {
        margin: 40px 0 0;
        font-family: Lora, Georgia, serif;
        font-size: 43px;
        line-height: 1.3;
        font-weight: 500;
        text-align: center;
      }
      .support {
        margin: 18px 0 0;
        font-size: 23px;
        line-height: 1.5;
        color: var(--primary);
        text-align: center;
      }
      .flow {
        width: 100%;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
        margin-top: auto;
      }
      .stage {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        height: 104px;
        padding: 12px 18px;
        background: white;
        border: 2px solid var(--line);
        border-radius: 20px;
        font-size: 22px;
        font-weight: 500;
        position: relative;
      }
      .stage svg {
        width: 36px;
        height: 36px;
        flex: none;
        color: var(--primary);
      }
    </style>
  </head>
