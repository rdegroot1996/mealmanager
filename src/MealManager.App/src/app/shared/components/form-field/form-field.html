<div class="fieldset w-full" [class]="compact() ? 'p-0 gap-1' : ''">
  <label class="fieldset-legend" [class]="compact() ? 'py-0 mb-0' : ''" [attr.for]="controlId()">
    {{ label() }}
    @if (required()) {
      <span aria-hidden="true" class="text-base-content/50"> *</span>
    }
  </label>
  <ng-content></ng-content>
  @if (hint()) {
    <p
      [id]="controlId() + '-hint'"
      class="label whitespace-normal break-words text-base-content/75"
    >
      {{ hint() }}
    </p>
  }
  @if (error()) {
    <p
      [id]="controlId() + '-error'"
      class="label whitespace-normal break-words text-error"
      role="alert"
    >
      {{ error() }}
    </p>
  }
</div>
