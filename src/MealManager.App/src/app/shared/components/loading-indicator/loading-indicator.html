<div
  class="flex flex-col items-center justify-center text-center text-base-content/75"
  [class.gap-3]="!compact()"
  [class.py-12]="!compact()"
  [class.gap-2]="compact()"
  [class.py-4]="compact()"
  [class.text-sm]="compact()"
  role="status"
>
  <span
    class="loading loading-spinner"
    [class.loading-md]="!compact()"
    [class.loading-sm]="compact()"
    aria-hidden="true"
  ></span>
  <div>
    <span class="block">{{ message() }}</span>
    @if (description()) {
      <span class="mt-2 block text-sm">{{ description() }}</span>
    }
  </div>
</div>
