<button
  type="button"
  cdkDragHandle
  class="btn btn-ghost btn-square w-11 min-h-11 shrink-0 cursor-grab p-0 text-base-content/50"
  [disabled]="disabled()"
  [attr.aria-label]="reorderItemLabel(item().name)"
  aria-keyshortcuts="ArrowUp ArrowDown"
  [attr.data-item-handle]="item().id"
  (keydown.arrowup)="move($event, -1)"
  (keydown.arrowdown)="move($event, 1)"
>
  <app-icon name="drag_indicator" class="size-5" />
</button>
<ng-content>
  <span class="min-w-0 flex-1 break-words [overflow-wrap:anywhere]">{{ item().name }}</span>
</ng-content>
<span class="ml-auto shrink-0 text-xs tabular-nums text-base-content/75"
  >{{ item().quantity }}×</span
>
<button
  class="btn btn-ghost btn-square size-11 min-h-11 shrink-0"
  type="button"
  [disabled]="disabled()"
  [attr.aria-label]="editItemLabel(item().name)"
  (click)="startEditing()"
>
  <app-icon name="edit" class="size-5" />
</button>
<app-grocery-edit-modal
  #editor
  [disabled]="disabled()"
  (saved)="save($event)"
  (removed)="remove()"
/>
