<aside class="hidden h-full border-r border-base-300 px-3.5 py-8 min-[800px]:block">
  <nav class="space-y-2" i18n-aria-label="@@navigation.main" aria-label="Main navigation">
    @for (item of items(); track item.route) {
      <a
        [routerLink]="item.route"
        class="app-nav-link flex min-h-12 items-center gap-3 rounded-field px-4 py-3 text-sm text-base-content/75 hover:bg-secondary/50"
        routerLinkActive="bg-secondary! text-secondary-content!"
        ariaCurrentWhenActive="page"
        [routerLinkActiveOptions]="{ exact: item.route === '/' }"
      >
        <app-icon [name]="item.icon" class="size-5" /><span>{{ item.name }}</span>
      </a>
    }
  </nav>
</aside>
<nav
  class="app-bottom-nav fixed inset-x-0 bottom-0 z-40 flex justify-around gap-1 border-t border-base-300 bg-base-100 px-3 pt-2 pb-[max(0.75rem,env(safe-area-inset-bottom))] min-[800px]:hidden"
  i18n-aria-label="@@navigation.main"
  aria-label="Main navigation"
>
  @for (item of items(); track item.route) {
    <a
      [routerLink]="item.route"
      class="flex min-h-12 min-w-0 flex-1 flex-col items-center justify-center gap-1 rounded-field px-1 py-2 text-xs text-base-content/75"
      routerLinkActive="bg-secondary! text-secondary-content!"
      ariaCurrentWhenActive="page"
      [routerLinkActiveOptions]="{ exact: item.route === '/' }"
      [attr.aria-label]="item.name"
    >
      <app-icon [name]="item.icon" class="size-5" /><span>{{ item.name }}</span>
    </a>
  }
</nav>
