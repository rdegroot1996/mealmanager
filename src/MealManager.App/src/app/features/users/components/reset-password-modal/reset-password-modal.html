<app-modal #modal [busy]="saving()" [beforeDismiss]="beforeDismiss" (closed)="endSession()">
  <h2 modal-title i18n="@@users.resetPassword">Reset password</h2>
  <p class="mb-4" i18n="@@users.resetPasswordConsequences">
    Reset the password for {{ user()?.displayName }}? This signs them out on all devices and removes
    any temporary sign-in block. They must replace the temporary password when they next sign in.
  </p>
  <app-form-field
    controlId="temporary-password"
    label="Temporary password"
    i18n-label="@@users.temporaryPassword"
    [hint]="passwordHint"
    [required]="true"
  >
    <input
      id="temporary-password"
      type="password"
      autocomplete="new-password"
      class="input h-11 w-full max-[799px]:text-base"
      aria-describedby="temporary-password-hint"
      [ngModel]="password()"
      (ngModelChange)="password.set($event)"
      [disabled]="saving()"
    />
  </app-form-field>
  @if (error()) {
    <p class="alert alert-error alert-soft mt-4" role="alert">{{ error() }}</p>
  }
  <button
    modal-actions
    type="button"
    class="btn btn-primary"
    [disabled]="saving()"
    (click)="save()"
  >
    @if (saving()) {
      <ng-container i18n="@@common.saving">Saving…</ng-container>
    } @else {
      <ng-container i18n="@@users.resetPassword">Reset password</ng-container>
    }
  </button>
</app-modal>
<app-confirmation-modal #discard />
