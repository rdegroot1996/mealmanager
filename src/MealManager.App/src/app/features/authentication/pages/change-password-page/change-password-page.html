@if (required()) {
  <app-auth-shell
    description="Replace your temporary password before continuing."
    i18n-description="@@authentication.replaceTemporaryPasswordDescription"
  >
    <h2 class="font-display text-2xl">
      <ng-container i18n="@@authentication.changePassword">Change password</ng-container>
    </h2>
    <ng-container [ngTemplateOutlet]="passwordForm" />
    <button
      class="btn btn-ghost w-full text-error"
      type="button"
      [disabled]="saving()"
      (click)="signOut()"
    >
      <ng-container i18n="@@app.app.template.signOut">Sign out</ng-container>
    </button>
  </app-auth-shell>
} @else {
  <section class="mx-auto max-w-lg">
    <h1 class="font-display text-[32px] font-medium">
      <ng-container i18n="@@authentication.changePassword">Change password</ng-container>
    </h1>
    <div class="app-surface mt-6 p-5"><ng-container [ngTemplateOutlet]="passwordForm" /></div>
  </section>
}

<ng-template #passwordForm>
  <form class="flex flex-col gap-5" (ngSubmit)="save()">
    <app-form-field
      controlId="current-password"
      label="Current password"
      i18n-label="@@authentication.currentPassword"
      [required]="true"
      [error]="fieldError('current')"
    >
      <input
        id="current-password"
        name="currentPassword"
        type="password"
        autocomplete="current-password"
        class="input h-11 w-full max-[799px]:text-base"
        [(ngModel)]="currentPassword"
        [disabled]="saving()"
        [attr.aria-invalid]="!!fieldError('current')"
        [attr.aria-describedby]="fieldError('current') ? 'current-password-error' : null"
      />
    </app-form-field>
    <app-form-field
      controlId="new-password"
      label="New password"
      i18n-label="@@authentication.newPassword"
      [required]="true"
      [hint]="passwordHint"
      [error]="fieldError('new')"
    >
      <input
        id="new-password"
        name="newPassword"
        type="password"
        autocomplete="new-password"
        class="input h-11 w-full max-[799px]:text-base"
        [(ngModel)]="newPassword"
        [disabled]="saving()"
        [attr.aria-invalid]="!!fieldError('new')"
        [attr.aria-describedby]="
          fieldError('new') ? 'new-password-error new-password-hint' : 'new-password-hint'
        "
      />
    </app-form-field>
    <app-form-field
      controlId="confirm-password"
      label="Confirm password"
      i18n-label="@@common.confirmPassword"
      [required]="true"
      [error]="fieldError('confirm')"
    >
      <input
        id="confirm-password"
        name="confirmPassword"
        type="password"
        autocomplete="new-password"
        class="input h-11 w-full max-[799px]:text-base"
        [(ngModel)]="confirmPassword"
        [disabled]="saving()"
        [attr.aria-invalid]="!!fieldError('confirm')"
        [attr.aria-describedby]="fieldError('confirm') ? 'confirm-password-error' : null"
      />
    </app-form-field>
    @if (error()) {
      <p class="alert alert-error alert-soft" role="alert">{{ error() }}</p>
    }
    <button class="btn btn-primary" type="submit" [disabled]="saving()" [attr.aria-busy]="saving()">
      @if (saving()) {
        <ng-container i18n="@@common.saving">Saving…</ng-container>
      } @else {
        <ng-container i18n="@@authentication.changePassword">Change password</ng-container>
      }
    </button>
  </form>
</ng-template>
