<app-auth-shell
  i18n-description="@@authentication.loginPage.template.descriptionSignInToManageYourMeals"
  description="Sign in to manage your meals."
>
  <form class="flex flex-col gap-5" (ngSubmit)="submit()">
    @if (error()) {
      <div class="alert alert-error alert-soft" role="alert">
        {{ error() }}
      </div>
    }

    <app-form-field
      controlId="login-email"
      [error]="fieldError('email')"
      i18n-label="@@common.email"
      label="Email"
      [required]="true"
    >
      <input
        class="input w-full max-[799px]:text-base border-base-300 bg-base-100 h-11"
        id="login-email"
        [disabled]="loading()"
        [attr.aria-invalid]="!!fieldError('email')"
        [attr.aria-describedby]="fieldError('email') ? 'login-email-error' : null"
        type="email"
        name="email"
        i18n-aria-label="@@common.email"
        aria-label="Email"
        [(ngModel)]="email"
        required
        autocomplete="email"
      />
    </app-form-field>

    <app-form-field
      controlId="login-password"
      [error]="fieldError('password')"
      i18n-label="@@common.password"
      label="Password"
      [required]="true"
    >
      <input
        class="input w-full max-[799px]:text-base border-base-300 bg-base-100 h-11"
        id="login-password"
        [disabled]="loading()"
        [attr.aria-invalid]="!!fieldError('password')"
        [attr.aria-describedby]="fieldError('password') ? 'login-password-error' : null"
        type="password"
        name="password"
        i18n-aria-label="@@common.password"
        aria-label="Password"
        [(ngModel)]="password"
        required
        autocomplete="current-password"
      />
    </app-form-field>

    <button
      class="btn btn-primary mt-2"
      type="submit"
      [disabled]="loading()"
      [attr.aria-busy]="loading()"
    >
      @if (loading()) {
        <ng-container i18n="@@authentication.loginPage.signingIn">Signing in...</ng-container>
      } @else {
        <ng-container i18n="@@authentication.signIn">Sign in</ng-container>
      }
    </button>
  </form>
  <p class="mt-4 text-sm text-base-content/75" i18n="@@authentication.passwordRecoveryHelp">
    Forgot your password? Ask a household administrator to reset it.
  </p>
</app-auth-shell>
