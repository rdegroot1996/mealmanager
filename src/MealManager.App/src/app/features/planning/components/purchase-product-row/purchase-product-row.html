<app-product-row
  [item]="item()"
  [disabled]="disabled()"
  (moveRequested)="moveRequested.emit($event)"
  (saved)="changed.emit($event)"
  (removed)="removed.emit()"
>
  <label class="flex min-h-11 min-w-0 flex-1 cursor-pointer items-center gap-2 sm:gap-3">
    <input
      type="checkbox"
      class="checkbox checkbox-sm checkbox-primary max-[799px]:text-base"
      [disabled]="disabled()"
      [checked]="item().selected"
      [attr.aria-label]="selectItemLabel(item().name)"
      (change)="toggled.emit()"
    />
    <span
      class="min-w-0 flex-1 break-words [overflow-wrap:anywhere]"
      [class.line-through]="!item().selected"
      [class.text-base-content/75]="!item().selected"
      >{{ item().name }}</span
    >
  </label>
</app-product-row>
