<article class="relative flex h-full min-w-0 flex-col">
  <app-recipe-favorite-button [recipe]="recipe()" />
  <a class="flex h-full flex-col" [routerLink]="['/recipes', recipe().id]">
    <figure>
      @if (recipe().imageUrl) {
        <img
          class="aspect-[1.18] min-[800px]:aspect-[1.3] w-full overflow-hidden rounded-box bg-secondary object-cover"
          [src]="recipe().imageUrl"
          alt=""
        />
      } @else {
        <div
          class="app-recipe-placeholder aspect-[1.18] min-[800px]:aspect-[1.3] w-full overflow-hidden rounded-box flex items-center justify-center"
          data-testid="recipe-image-placeholder"
        >
          <app-icon name="restaurant" class="size-10" />
        </div>
      }
    </figure>
    <div class="flex flex-1 flex-col gap-2 pt-3">
      <div class="flex flex-col gap-1" data-testid="recipe-heading">
        <h2 class="font-sans font-medium line-clamp-2 text-sm leading-snug sm:text-[15px]">
          {{ recipe().name }}
        </h2>
        <p
          class="flex items-center gap-1.5 text-xs text-base-content/75"
          data-testid="recipe-category"
        >
          <app-icon name="restaurant" class="size-4 text-accent-content" />
          <span>{{ categoryLabel(recipe().category) }}</span>
        </p>
      </div>
      @if (recipe().tags.length) {
        <div class="flex flex-wrap items-center gap-1.5 pt-1" data-testid="recipe-tags">
          @for (tag of recipe().tags; track tag.id) {
            <span
              class="badge badge-secondary badge-sm h-auto min-h-6 max-w-full py-1 text-xs break-words whitespace-normal"
              >{{ tag.name }}</span
            >
          }
        </div>
      }
    </div>
  </a>
</article>
